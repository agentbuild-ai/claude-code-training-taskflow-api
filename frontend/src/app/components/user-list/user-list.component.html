<div class="bg-white rounded-lg shadow p-5">
  <h2 class="text-lg font-semibold text-slate-800 mb-4">Users</h2>

  @if (usersService.error()) {
    <p class="text-sm text-red-600 mb-3">{{ usersService.error() }}</p>
  }

  <form (ngSubmit)="submit()" class="flex flex-wrap gap-2 mb-4">
    <input
      [(ngModel)]="name"
      name="name"
      placeholder="Name"
      class="flex-1 min-w-[8rem] rounded border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
    />
    <input
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      class="flex-1 min-w-[8rem] rounded border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
    />
    <button
      type="submit"
      class="rounded bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-700"
    >
      Add user
    </button>
  </form>

  <ul class="divide-y divide-slate-100">
    @for (user of usersService.users(); track user.id) {
      <li class="flex items-center justify-between py-2 text-sm">
        <div>
          <span class="font-medium text-slate-800">{{ user.name }}</span>
          <span class="text-slate-400"> — {{ user.email }}</span>
        </div>
        <button
          (click)="usersService.remove(user.id)"
          class="text-slate-400 hover:text-red-600"
          aria-label="Delete user"
        >
          Delete
        </button>
      </li>
    } @empty {
      <li class="py-2 text-sm text-slate-400">No users yet.</li>
    }
  </ul>
</div>
